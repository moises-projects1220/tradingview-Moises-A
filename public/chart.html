<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingView by Moises Angarita</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', sans-serif; height: 100vh; overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; }
#header { background: #1e222d; border-bottom: 1px solid #2a2e39; padding: 0 12px; height: 46px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#header-title { font-size: 15px; font-weight: 700; color: #fff; }
#header-title span { color: #2962ff; }
#symbol-display { font-size: 13px; font-weight: 600; color: #fff; background: #2a2e39; padding: 4px 10px; border-radius: 4px; }
#price-display { font-size: 13px; font-weight: 600; }
#change-display { font-size: 12px; }
.tf-btn { background: none; border: none; color: #787b86; font-size: 12px; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
.tf-btn:hover, .tf-btn.active { background: #2962ff; color: #fff; }
#main { display: flex; flex: 1; overflow: hidden; }
#watchlist { width: 180px; background: #1e222d; border-right: 1px solid #2a2e39; overflow-y: auto; flex-shrink: 0; }
#watchlist-title { font-size: 11px; color: #787b86; padding: 8px 12px 4px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2a2e39; }
.wl-item { padding: 8px 12px; border-bottom: 1px solid #1a1e2e; cursor: pointer; }
.wl-item:hover { background: #2a2e39; }
.wl-item.active { background: #2a2e3a; border-left: 2px solid #2962ff; }
.wl-symbol { font-size: 12px; font-weight: 600; color: #d1d4dc; }
.wl-price { font-size: 11px; color: #787b86; margin-top: 2px; }
.wl-change { font-size: 10px; margin-top: 1px; }
.up { color: #26a69a; } .dn { color: #ef5350; }
#chart-area { flex: 1; position: relative; overflow: hidden; }
#chart { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; }
#watermark { position: absolute; bottom: 8px; left: 12px; font-size: 11px; color: rgba(255,255,255,0.18); pointer-events: none; z-index: 10; user-select: none; }
#legend { position: absolute; top: 8px; left: 12px; font-size: 11px; pointer-events: none; z-index: 10; }
.legend-item { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.legend-dot { width: 20px; height: 2px; border-radius: 1px; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #787b86; font-size: 13px; text-align: center; z-index: 20; }
#selector-bar { display: flex; align-items: center; gap: 4px; margin-left: auto; }
#tooltip { position: absolute; background: #1e222d; border: 1px solid #363a45; border-radius: 4px; padding: 6px 10px; font-size: 11px; pointer-events: none; z-index: 30; display: none; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-title">Trading<span>View</span> <span style="color:#787b86;font-weight:400;font-size:12px;">by Moises Angarita</span></div>
    <div style="width:1px;height:20px;background:#2a2e39;"></div>
    <div id="symbol-display">BTC/USD</div>
    <div id="price-display" class="up">--</div>
    <div id="change-display" class="up">--</div>
    <div id="selector-bar">
      <button class="tf-btn active" data-days="1" data-label="1D">1D</button>
      <button class="tf-btn" data-days="7" data-label="7D">7D</button>
      <button class="tf-btn" data-days="30" data-label="1M">1M</button>
      <button class="tf-btn" data-days="90" data-label="3M">3M</button>
      <button class="tf-btn" data-days="365" data-label="1A">1A</button>
    </div>
  </div>
  <div id="main">
    <div id="watchlist">
      <div id="watchlist-title">Watchlist</div>
      <div id="wl-list"></div>
    </div>
    <div id="chart-area">
      <canvas id="chart"></canvas>
      <canvas id="overlay"></canvas>
      <div id="tooltip"></div>
      <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#f5c842;"></div><span style="color:#f5c842;">EMA 50</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef5350;"></div><span style="color:#ef5350;">EMA 200</span></div>
      </div>
      <div id="watermark">TradingView by: Moises Angarita</div>
      <div id="loading">Cargando datos...</div>
    </div>
  </div>
</div>
<script>
const COINS = [
  {id:'bitcoin',n:'BTC/USD'},{id:'ethereum',n:'ETH/USD'},{id:'solana',n:'SOL/USD'},
  {id:'binancecoin',n:'BNB/USD'},{id:'ripple',n:'XRP/USD'},{id:'cardano',n:'ADA/USD'},
  {id:'dogecoin',n:'DOGE/USD'},{id:'avalanche-2',n:'AVAX/USD'},
];

let currentCoin = COINS[0];
let currentDays = 1;
let candles = [];
let offsetX = 0;
let scaleX = 1;
let isDragging = false;
let dragStartX = 0;
let dragStartOffset = 0;

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const loading = document.getElementById('loading');
const tooltip = document.getElementById('tooltip');
const area = document.getElementById('chart-area');

const PAD_L=10, PAD_R=75, PAD_T=20, PAD_B=30;

function resize() {
  canvas.width = overlay.width = area.clientWidth;
  canvas.height = overlay.height = area.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

function calcEMA(data, period) {
  const k=2/(period+1); let ema=[],val=null;
  for(let i=0;i<data.length;i++){
    if(i<period-1){ema.push(null);continue;}
    if(i===period-1){val=data.slice(0,period).reduce((a,b)=>a+b,0)/period;ema.push(val);continue;}
    val=data[i]*k+val*(1-k);ema.push(val);
  }
  return ema;
}

function getVisible() {
  const chartW = canvas.width - PAD_L - PAD_R;
  const visibleCount = Math.max(10, Math.floor(chartW / (10 * scaleX)));
  const maxOff = Math.max(0, candles.length - visibleCount);
  const off = Math.max(0, Math.min(offsetX, maxOff));
  const start = Math.max(0, candles.length - visibleCount - off);
  const end = candles.length - off;
  return { vis: candles.slice(start, end), start, end };
}

function priceRange(vis) {
  let lo=Infinity, hi=-Infinity;
  vis.forEach(c=>{ if(c.low<lo)lo=c.low; if(c.high>hi)hi=c.high; });
  const pad=(hi-lo)*0.05||1;
  return { lo: lo-pad, hi: hi+pad };
}

function draw() {
  if(!candles.length) return;
  const W=canvas.width, H=canvas.height;
  const chartW=W-PAD_L-PAD_R, chartH=H-PAD_T-PAD_B;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#131722'; ctx.fillRect(0,0,W,H);

  const {vis,start,end} = getVisible();
  if(!vis.length) return;
  const {lo,hi} = priceRange(vis);
  const N=vis.length;
  const step=chartW/N;
  const cw=Math.max(1,Math.min(16,step*0.7));
  function xOf(i){return PAD_L+i*step+step/2;}
  function yOf(v){return PAD_T+(1-(v-lo)/(hi-lo))*chartH;}

  // Grid
  ctx.strokeStyle='#1e222d'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const y=PAD_T+i*(chartH/5);
    ctx.beginPath();ctx.moveTo(PAD_L,y);ctx.lineTo(W-PAD_R,y);ctx.stroke();
    const val=hi-i*(hi-lo)/5;
    ctx.fillStyle='#787b86';ctx.font='10px sans-serif';ctx.textAlign='left';
    ctx.fillText(val>100?val.toFixed(0):val.toFixed(4),W-PAD_R+4,y+4);
  }

  // Velas
  vis.forEach((c,i)=>{
    const x=xOf(i),up=c.close>=c.open,col=up?'#26a69a':'#ef5350';
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,yOf(c.high));ctx.lineTo(x,yOf(c.low));ctx.stroke();
    const y1=yOf(c.open),y2=yOf(c.close);
    ctx.fillRect(x-cw/2,Math.min(y1,y2),cw,Math.max(Math.abs(y1-y2),1));
  });

  // EMAs
  const allC=candles.map(c=>c.close);
  const e50=calcEMA(allC,50).slice(start,end);
  const e200=calcEMA(allC,200).slice(start,end);
  [[e50,'#f5c842'],[e200,'#ef5350']].forEach(([ema,col])=>{
    ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=1.5;
    let s=false;
    ema.forEach((v,i)=>{if(!v)return;const x=xOf(i),y=yOf(v);s?(ctx.lineTo(x,y)):(ctx.moveTo(x,y));s=true;});
    ctx.stroke();
  });

  // Tiempo
  ctx.fillStyle='#787b86';ctx.font='10px sans-serif';ctx.textAlign='center';
  const step2=Math.max(1,Math.floor(N/6));
  for(let i=0;i<N;i+=step2){
    const d=new Date(vis[i].time);
    const lbl=currentDays<=1?d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('es',{month:'short',day:'numeric'});
    ctx.fillText(lbl,xOf(i),H-8);
  }
}

function drawCrosshair(mx,my) {
  const W=overlay.width,H=overlay.height;
  octx.clearRect(0,0,W,H);
  if(mx<PAD_L||mx>W-PAD_R||my<PAD_T||my>H-PAD_B) return;
  octx.setLineDash([4,4]);
  octx.strokeStyle='rgba(255,255,255,0.15)';
  octx.lineWidth=1;
  octx.beginPath();octx.moveTo(mx,PAD_T);octx.lineTo(mx,H-PAD_B);octx.stroke();
  octx.beginPath();octx.moveTo(PAD_L,my);octx.lineTo(W-PAD_R,my);octx.stroke();
  octx.setLineDash([]);
  if(!candles.length) return;
  const {vis}=getVisible();
  const {lo,hi}=priceRange(vis);
  const chartH=H-PAD_T-PAD_B;
  const price=hi-((my-PAD_T)/chartH)*(hi-lo);
  octx.fillStyle='#2962ff';
  octx.fillRect(W-PAD_R,my-10,PAD_R,20);
  octx.fillStyle='#fff';octx.font='10px sans-serif';octx.textAlign='left';
  octx.fillText(price>100?price.toFixed(2):price.toFixed(5),W-PAD_R+4,my+4);
}

overlay.addEventListener('mousemove',(e)=>{
  const r=overlay.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  drawCrosshair(mx,my);
  if(isDragging){
    const diff=mx-dragStartX;
    offsetX=Math.max(0,dragStartOffset-Math.round(diff/(8*scaleX)));
    draw();
  }
  // Tooltip
  const {vis}=getVisible();
  if(!vis.length) return;
  const chartW=canvas.width-PAD_L-PAD_R;
  const step=chartW/vis.length;
  const idx=Math.floor((mx-PAD_L)/step);
  if(idx>=0&&idx<vis.length){
    const c=vis[idx];
    const d=new Date(c.time);
    const fmt=v=>v>100?v.toFixed(2):v.toFixed(5);
    tooltip.style.display='block';
    tooltip.style.left=Math.min(mx+15,canvas.width-160)+'px';
    tooltip.style.top=Math.max(my-80,10)+'px';
    tooltip.innerHTML=`<div style="color:#787b86;margin-bottom:4px">${d.toLocaleString('es')}</div>
      <div>O: <span style="color:#d1d4dc">${fmt(c.open)}</span></div>
      <div>H: <span style="color:#26a69a">${fmt(c.high)}</span></div>
      <div>L: <span style="color:#ef5350">${fmt(c.low)}</span></div>
      <div>C: <span style="color:#d1d4dc">${fmt(c.close)}</span></div>`;
  }
});

overlay.addEventListener('mouseleave',()=>{
  octx.clearRect(0,0,overlay.width,overlay.height);
  tooltip.style.display='none';
  isDragging=false;
  overlay.style.cursor='crosshair';
});
overlay.addEventListener('mousedown',(e)=>{
  isDragging=true;
  dragStartX=e.clientX-overlay.getBoundingClientRect().left;
  dragStartOffset=offsetX;
  overlay.style.cursor='grabbing';
});
overlay.addEventListener('mouseup',()=>{ isDragging=false; overlay.style.cursor='crosshair'; });
overlay.addEventListener('wheel',(e)=>{
  e.preventDefault();
  scaleX=Math.max(0.3,Math.min(6,scaleX*(e.deltaY>0?0.9:1.1)));
  draw();
},{passive:false});

async function loadCandles(coin,days) {
  loading.style.display='block';
  loading.textContent='Cargando datos...';
  try {
    const res=await fetch(`https://api.coingecko.com/api/v3/coins/${coin.id}/ohlc?vs_currency=usd&days=${days}`);
    if(!res.ok) throw new Error();
    const data=await res.json();
    candles=data.map(k=>({time:k[0],open:k[1],high:k[2],low:k[3],close:k[4]}));
    offsetX=0;
    loading.style.display='none';
    draw();
    if(candles.length){
      const last=candles[candles.length-1].close;
      const first=candles[0].open;
      const ch=((last-first)/first*100).toFixed(2);
      const pEl=document.getElementById('price-display');
      const cEl=document.getElementById('change-display');
      pEl.textContent=last>100?last.toFixed(2):last.toFixed(5);
      pEl.className=ch>=0?'up':'dn';
      cEl.textContent=(ch>=0?'+':'')+ch+'%';
      cEl.className=ch>=0?'up':'dn';
    }
  } catch(e){
    loading.textContent='Error. Reintentando...';
    setTimeout(()=>loadCandles(coin,days),4000);
  }
}

async function loadWatchlistPrices() {
  try {
    const ids=COINS.map(c=>c.id).join(',');
    const res=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
    if(!res.ok) return;
    const data=await res.json();
    COINS.forEach(coin=>{
      const d=data[coin.id]; if(!d) return;
      const p=d.usd, ch=d.usd_24h_change||0;
      const pEl=document.getElementById('wlp-'+coin.id);
      const cEl=document.getElementById('wlc-'+coin.id);
      if(pEl) pEl.textContent=p>100?p.toFixed(2):p.toFixed(4);
      if(cEl){cEl.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';cEl.className='wl-change '+(ch>=0?'up':'dn');}
    });
  } catch(e){}
}

function buildWatchlist() {
  const list=document.getElementById('wl-list');
  list.innerHTML='';
  COINS.forEach(coin=>{
    const div=document.createElement('div');
    div.className='wl-item'+(coin.id===currentCoin.id?' active':'');
    div.innerHTML=`<div class="wl-symbol">${coin.n}</div><div class="wl-price" id="wlp-${coin.id}">--</div><div class="wl-change" id="wlc-${coin.id}">--</div>`;
    div.addEventListener('click',()=>{
      currentCoin=coin;
      document.getElementById('symbol-display').textContent=coin.n;
      document.querySelectorAll('.wl-item').forEach(el=>el.classList.remove('active'));
      div.classList.add('active');
      loadCandles(coin,currentDays);
    });
    list.appendChild(div);
  });
}

document.querySelectorAll('.tf-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentDays=parseInt(btn.dataset.days);
    loadCandles(currentCoin,currentDays);
  });
});

buildWatchlist();
resize();
loadCandles(currentCoin,currentDays);
loadWatchlistPrices();
setInterval(loadWatchlistPrices,30000);
setInterval(()=>loadCandles(currentCoin,currentDays),60000);
</script>
</body>
</html>
