<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingView by Moises Angarita</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', sans-serif; height: 100vh; overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100vh; }
#header { background: #1e222d; border-bottom: 1px solid #2a2e39; padding: 0 12px; height: 46px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#header-title { font-size: 15px; font-weight: 700; color: #fff; }
#header-title span { color: #2962ff; }
#symbol-display { font-size: 13px; font-weight: 600; color: #fff; background: #2a2e39; padding: 4px 10px; border-radius: 4px; }
#price-display { font-size: 13px; font-weight: 600; }
#change-display { font-size: 12px; }
.tf-btn { background: none; border: none; color: #787b86; font-size: 12px; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
.tf-btn:hover, .tf-btn.active { background: #2962ff; color: #fff; }
#main { display: flex; flex: 1; overflow: hidden; }
#watchlist { width: 180px; background: #1e222d; border-right: 1px solid #2a2e39; overflow-y: auto; flex-shrink: 0; }
#watchlist-title { font-size: 11px; color: #787b86; padding: 8px 12px 4px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #2a2e39; }
.wl-item { padding: 8px 12px; border-bottom: 1px solid #1a1e2e; cursor: pointer; }
.wl-item:hover { background: #2a2e39; }
.wl-item.active { background: #2a2e3a; border-left: 2px solid #2962ff; }
.wl-symbol { font-size: 12px; font-weight: 600; color: #d1d4dc; }
.wl-price { font-size: 11px; color: #787b86; margin-top: 2px; }
.wl-change { font-size: 10px; margin-top: 1px; }
.up { color: #26a69a; } .dn { color: #ef5350; }
#chart-area { flex: 1; position: relative; overflow: hidden; cursor: crosshair; }
#chart { width: 100%; height: 100%; }
#watermark { position: absolute; bottom: 8px; left: 12px; font-size: 11px; color: rgba(255,255,255,0.18); pointer-events: none; z-index: 10; user-select: none; }
#legend { position: absolute; top: 8px; left: 12px; font-size: 11px; pointer-events: none; z-index: 10; }
.legend-item { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.legend-dot { width: 20px; height: 2px; border-radius: 1px; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #787b86; font-size: 13px; text-align: center; }
#selector-bar { display: flex; align-items: center; gap: 4px; margin-left: auto; }
#crosshair { position: absolute; pointer-events: none; z-index: 5; top: 0; left: 0; width: 100%; height: 100%; }
#tooltip { position: absolute; background: #1e222d; border: 1px solid #2a2e39; border-radius: 4px; padding: 6px 10px; font-size: 11px; pointer-events: none; z-index: 20; display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-title">Trading<span>View</span> <span style="color:#787b86;font-weight:400;font-size:12px;">by Moises Angarita</span></div>
    <div style="width:1px;height:20px;background:#2a2e39;"></div>
    <div id="symbol-display">BTCUSDT</div>
    <div id="price-display" class="up">--</div>
    <div id="change-display" class="up">--</div>
    <div id="selector-bar">
      <button class="tf-btn active" data-tf="1m">1m</button>
      <button class="tf-btn" data-tf="15m">15m</button>
      <button class="tf-btn" data-tf="1h">1h</button>
      <button class="tf-btn" data-tf="1d">1D</button>
    </div>
  </div>
  <div id="main">
    <div id="watchlist">
      <div id="watchlist-title">Watchlist</div>
      <div id="wl-list"></div>
    </div>
    <div id="chart-area">
      <canvas id="chart"></canvas>
      <canvas id="crosshair"></canvas>
      <div id="tooltip"></div>
      <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#f5c842;"></div><span style="color:#f5c842;">EMA 50</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef5350;"></div><span style="color:#ef5350;">EMA 200</span></div>
      </div>
      <div id="watermark">TradingView by: Moises Angarita</div>
      <div id="loading">Cargando datos...</div>
    </div>
  </div>
</div>
<script>
const COINS = [
  {s:'BTCUSDT',n:'BTC/USDT'},{s:'ETHUSDT',n:'ETH/USDT'},{s:'SOLUSDT',n:'SOL/USDT'},
  {s:'BNBUSDT',n:'BNB/USDT'},{s:'XRPUSDT',n:'XRP/USDT'},{s:'ADAUSDT',n:'ADA/USDT'},
  {s:'DOGEUSDT',n:'DOGE/USDT'},{s:'AVAXUSDT',n:'AVAX/USDT'},
];
const TF = {'1m':'1m','15m':'15m','1h':'1h','1d':'1d'};
let currentSymbol = 'BTCUSDT';
let currentTf = '1m';
let candles = [];
let ws = null;

// Navegacion
let offsetX = 0;
let scaleX = 1;
let isDragging = false;
let dragStartX = 0;
let dragStartOffset = 0;

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const chCanvas = document.getElementById('crosshair');
const chCtx = chCanvas.getContext('2d');
const loading = document.getElementById('loading');
const tooltip = document.getElementById('tooltip');

const PAD_L=10, PAD_R=70, PAD_T=20, PAD_B=30;

function resize() {
  const area = document.getElementById('chart-area');
  canvas.width = chCanvas.width = area.clientWidth;
  canvas.height = chCanvas.height = area.clientHeight;
  draw();
}
window.addEventListener('resize', resize);

function calcEMA(data, period) {
  const k=2/(period+1); let ema=[],val=null;
  for(let i=0;i<data.length;i++){
    if(i<period-1){ema.push(null);continue;}
    if(i===period-1){val=data.slice(0,period).reduce((a,b)=>a+b,0)/period;ema.push(val);continue;}
    val=data[i]*k+val*(1-k);ema.push(val);
  }
  return ema;
}

function getVisibleCandles() {
  const W = canvas.width;
  const chartW = W - PAD_L - PAD_R;
  const totalCandles = candles.length;
  const visibleCount = Math.floor(chartW / (8 * scaleX));
  const maxOffset = Math.max(0, totalCandles - visibleCount);
  const clampedOffset = Math.max(0, Math.min(offsetX, maxOffset));
  const start = Math.max(0, totalCandles - visibleCount - clampedOffset);
  const end = Math.max(0, totalCandles - clampedOffset);
  return { visible: candles.slice(start, end), start, end };
}

function draw() {
  if(!candles.length) return;
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#131722'; ctx.fillRect(0,0,W,H);
  const chartW=W-PAD_L-PAD_R, chartH=H-PAD_T-PAD_B;
  const {visible} = getVisibleCandles();
  if(!visible.length) return;
  const closes=visible.map(c=>c.close);
  const allCloses=candles.map(c=>c.close);
  const ema50full=calcEMA(allCloses,50);
  const ema200full=calcEMA(allCloses,200);
  const {start,end}=getVisibleCandles();
  const ema50=ema50full.slice(start,end);
  const ema200=ema200full.slice(start,end);
  let minP=Infinity,maxP=-Infinity;
  visible.forEach(c=>{if(c.low<minP)minP=c.low;if(c.high>maxP)maxP=c.high;});
  const range=maxP-minP||1, pad=range*0.05;
  const lo=minP-pad, hi=maxP+pad;
  const N=visible.length;
  const step=chartW/N;
  const candleW=Math.max(1,Math.min(14,step*0.7));
  function xOf(i){return PAD_L+i*step+step/2;}
  function yOf(v){return PAD_T+(1-(v-lo)/(hi-lo))*chartH;}

  // Grid
  ctx.strokeStyle='#1e222d'; ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const y=PAD_T+i*(chartH/5);
    ctx.beginPath();ctx.moveTo(PAD_L,y);ctx.lineTo(W-PAD_R,y);ctx.stroke();
    const val=hi-i*(hi-lo)/5;
    ctx.fillStyle='#787b86';ctx.font='10px sans-serif';ctx.textAlign='left';
    ctx.fillText(val>100?val.toFixed(0):val.toFixed(5),W-PAD_R+4,y+4);
  }

  // Velas
  visible.forEach((c,i)=>{
    const x=xOf(i),isUp=c.close>=c.open,col=isUp?'#26a69a':'#ef5350';
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,yOf(c.high));ctx.lineTo(x,yOf(c.low));ctx.stroke();
    const oY=yOf(c.open),cY=yOf(c.close),bY=Math.min(oY,cY),bH=Math.max(Math.abs(oY-cY),1);
    ctx.fillRect(x-candleW/2,bY,candleW,bH);
  });

  // EMA 50
  ctx.beginPath();ctx.strokeStyle='#f5c842';ctx.lineWidth=1.5;
  let started=false;
  ema50.forEach((v,i)=>{if(v===null)return;const x=xOf(i),y=yOf(v);if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);});
  ctx.stroke();

  // EMA 200
  ctx.beginPath();ctx.strokeStyle='#ef5350';ctx.lineWidth=1.5;
  started=false;
  ema200.forEach((v,i)=>{if(v===null)return;const x=xOf(i),y=yOf(v);if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);});
  ctx.stroke();

  // Tiempo
  ctx.fillStyle='#787b86';ctx.font='10px sans-serif';ctx.textAlign='center';
  const step2=Math.max(1,Math.floor(N/6));
  for(let i=0;i<N;i+=step2){
    const d=new Date(visible[i].time);
    const label=currentTf==='1d'?d.toLocaleDateString('es',{month:'short',day:'numeric'}):d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
    ctx.fillText(label,xOf(i),H-8);
  }
}

// Crosshair
function drawCrosshair(mx, my) {
  const W=chCanvas.width, H=chCanvas.height;
  chCtx.clearRect(0,0,W,H);
  chCtx.setLineDash([4,4]);
  chCtx.strokeStyle='rgba(255,255,255,0.2)';
  chCtx.lineWidth=1;
  chCtx.beginPath();chCtx.moveTo(mx,PAD_T);chCtx.lineTo(mx,H-PAD_B);chCtx.stroke();
  chCtx.beginPath();chCtx.moveTo(PAD_L,my);chCtx.lineTo(W-PAD_R,my);chCtx.stroke();
  chCtx.setLineDash([]);
  // Precio en el eje Y
  if(!candles.length) return;
  const chartH=H-PAD_T-PAD_B;
  const {visible}=getVisibleCandles();
  if(!visible.length) return;
  let minP=Infinity,maxP=-Infinity;
  visible.forEach(c=>{if(c.low<minP)minP=c.low;if(c.high>maxP)maxP=c.high;});
  const range=maxP-minP||1,pad=range*0.05;
  const lo=minP-pad,hi=maxP+pad;
  const price=hi-((my-PAD_T)/chartH)*(hi-lo);
  chCtx.fillStyle='#2962ff';
  chCtx.fillRect(W-PAD_R,my-10,PAD_R,20);
  chCtx.fillStyle='#fff';chCtx.font='10px sans-serif';chCtx.textAlign='left';
  chCtx.fillText(price>100?price.toFixed(2):price.toFixed(5),W-PAD_R+4,my+4);
}

// Mouse eventos
const area = document.getElementById('chart-area');
area.addEventListener('mousemove', (e) => {
  const rect = area.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  drawCrosshair(mx, my);
  if(isDragging) {
    const diff = mx - dragStartX;
    const candlesPer100px = 100 / (8 * scaleX);
    offsetX = dragStartOffset + Math.round(diff / 8 * scaleX * -1);
    offsetX = Math.max(0, offsetX);
    draw();
  }
  // Tooltip
  if(candles.length) {
    const {visible} = getVisibleCandles();
    const W=canvas.width, chartW=W-PAD_L-PAD_R;
    const step=chartW/visible.length;
    const idx=Math.floor((mx-PAD_L)/step);
    if(idx>=0&&idx<visible.length){
      const c=visible[idx];
      const d=new Date(c.time);
      tooltip.style.display='block';
      tooltip.style.left=(mx+15)+'px';
      tooltip.style.top=(my-60)+'px';
      tooltip.innerHTML=`<div style="color:#787b86;margin-bottom:3px">${d.toLocaleString('es')}</div>
        <div>O: <span style="color:#d1d4dc">${c.open>100?c.open.toFixed(2):c.open.toFixed(5)}</span></div>
        <div>H: <span style="color:#26a69a">${c.high>100?c.high.toFixed(2):c.high.toFixed(5)}</span></div>
        <div>L: <span style="color:#ef5350">${c.low>100?c.low.toFixed(2):c.low.toFixed(5)}</span></div>
        <div>C: <span style="color:#d1d4dc">${c.close>100?c.close.toFixed(2):c.close.toFixed(5)}</span></div>`;
    }
  }
});
area.addEventListener('mouseleave', () => {
  chCtx.clearRect(0,0,chCanvas.width,chCanvas.height);
  tooltip.style.display='none';
  isDragging=false;
});
area.addEventListener('mousedown', (e) => {
  isDragging=true;
  dragStartX=e.clientX-area.getBoundingClientRect().left;
  dragStartOffset=offsetX;
  area.style.cursor='grabbing';
});
area.addEventListener('mouseup', () => { isDragging=false; area.style.cursor='crosshair'; });

// Zoom con rueda
area.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scaleX = Math.max(0.3, Math.min(5, scaleX * delta));
  draw();
}, {passive:false});

async function loadCandles(symbol, tf) {
  loading.style.display='block';
  loading.textContent='Cargando datos...';
  try {
    const url=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${TF[tf]}&limit=500`;
    const res=await fetch(url);
    if(!res.ok) throw new Error();
    const data=await res.json();
    candles=data.map(k=>({time:k[0],open:parseFloat(k[1]),high:parseFloat(k[2]),low:parseFloat(k[3]),close:parseFloat(k[4])}));
    offsetX=0;
    loading.style.display='none';
    draw();
    updateHeader(candles[candles.length-1].close, candles[0].open);
  } catch(e){
    loading.textContent='Error. Reintentando...';
    setTimeout(()=>loadCandles(symbol,tf), 3000);
  }
}

function updateHeader(last, first) {
  const ch=((last-first)/first*100).toFixed(2);
  const pEl=document.getElementById('price-display');
  const cEl=document.getElementById('change-display');
  pEl.textContent=last>100?last.toFixed(2):last.toFixed(5);
  pEl.className=ch>=0?'up':'dn';
  cEl.textContent=(ch>=0?'+':'')+ch+'%';
  cEl.className=ch>=0?'up':'dn';
}

function connectWS(symbol, tf) {
  if(ws) ws.close();
  ws=new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_${TF[tf]}`);
  ws.onmessage=(e)=>{
    const k=JSON.parse(e.data).k;
    if(!k) return;
    const last={time:k.t,open:parseFloat(k.o),high:parseFloat(k.h),low:parseFloat(k.l),close:parseFloat(k.c)};
    if(candles.length&&candles[candles.length-1].time===last.time) candles[candles.length-1]=last;
    else candles.push(last);
    if(candles.length>500) candles.shift();
    updateHeader(last.close, candles[0].open);
    draw();
  };
  ws.onerror=()=>setTimeout(()=>connectWS(symbol,tf),3000);
}

function buildWatchlist() {
  const list=document.getElementById('wl-list');
  list.innerHTML='';
  COINS.forEach(coin=>{
    const div=document.createElement('div');
    div.className='wl-item'+(coin.s===currentSymbol?' active':'');
    div.innerHTML=`<div class="wl-symbol">${coin.n}</div><div class="wl-price" id="wlp-${coin.s}">--</div><div class="wl-change" id="wlc-${coin.s}">--</div>`;
    div.addEventListener('click',()=>{
      currentSymbol=coin.s;
      document.getElementById('symbol-display').textContent=coin.n;
      document.querySelectorAll('.wl-item').forEach(el=>el.classList.remove('active'));
      div.classList.add('active');
      loadCandles(coin.s,currentTf);
      connectWS(coin.s,currentTf);
    });
    list.appendChild(div);
  });
}

async function loadWatchlistPrices() {
  try {
    const ids=COINS.map(c=>`"${c.s}"`).join(',');
    const res=await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=[${ids}]`);
    if(!res.ok) return;
    const data=await res.json();
    data.forEach(t=>{
      const p=parseFloat(t.lastPrice),ch=parseFloat(t.priceChangePercent);
      const pEl=document.getElementById('wlp-'+t.symbol);
      const cEl=document.getElementById('wlc-'+t.symbol);
      if(pEl) pEl.textContent=p>100?p.toFixed(2):p.toFixed(4);
      if(cEl){cEl.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';cEl.className='wl-change '+(ch>=0?'up':'dn');}
    });
  } catch(e){}
}

document.querySelectorAll('.tf-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTf=btn.dataset.tf;
    loadCandles(currentSymbol,currentTf);
    connectWS(currentSymbol,currentTf);
  });
});

buildWatchlist();
resize();
loadCandles(currentSymbol,currentTf);
connectWS(currentSymbol,currentTf);
loadWatchlistPrices();
setInterval(loadWatchlistPrices,10000);
</script>
</body>
</html>
